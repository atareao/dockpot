name: nextcloud
category: cloud
description: Nextcloud cloud storage with PostgreSQL, Redis and Nginx
variables:
- name: NC_PORT
  description: Nc Port
  default: '8080'
  required: false
- name: NC_TAG
  description: Nc Tag
  default: latest
  required: false
- name: DB_PASS
  description: Db Pass
  default: change-me
  required: true
- name: ADMIN_USER
  description: Admin User
  default: admin
  required: false
- name: ADMIN_PASS
  description: Admin Pass
  default: admin
  required: true
compose: "services:\n  db:\n    image: postgres:alpine\n    container_name: ${STACK_NAME}_db\n\
  \    restart: always\n    volumes:\n      - ${STACK_NAME}_database:/var/lib/postgresql/data\n\
  \    environment:\n      - POSTGRES_PASSWORD=${DB_PASS}\n      - POSTGRES_USER=nextcloud\n\
  \      - POSTGRES_DB=nextcloud\n  redis:\n    image: redis:alpine\n    container_name:\
  \ ${STACK_NAME}_redis\n    restart: always\n  app:\n    image: nextcloud:fpm-alpine\n\
  \    container_name: ${STACK_NAME}_app\n    restart: always\n    volumes:\n    \
  \  - ${STACK_NAME}_data:/var/www/html\n    environment:\n      - POSTGRES_HOST=db\n\
  \      - REDIS_HOST=redis\n      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}\n      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASS}\n\
  \      - POSTGRES_PASSWORD=${DB_PASS}\n    depends_on:\n      - db\n      - redis\n\
  \  web:\n    image: nginx:alpine\n    container_name: ${STACK_NAME}_web\n    restart:\
  \ always\n    volumes:\n      - ${STACK_NAME}_data:/var/www/html:ro\n    ports:\n\
  \      - \"${NC_PORT}:80\"\n    depends_on:\n      - app\n  cron:\n    image: nextcloud:fpm-alpine\n\
  \    container_name: ${STACK_NAME}_cron\n    restart: always\n    volumes:\n   \
  \   - ${STACK_NAME}_data:/var/www/html\n    entrypoint: /cron.sh\n    depends_on:\n\
  \      - db\n      - redis"
