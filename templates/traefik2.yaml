name: traefik2
description: "Traefik2"
category: proxy
variables:
  - name: TRAEFIK_TAG
    description: "Image tag"
    default: "latest"
    required: false
  - name: EMAIL
    description: "LetsEncrypt email"
    default: "admin@example.com"
    required: true
  - name: DOMAIN
    description: "Primary domain"
    default: "example.com"
    required: true
  - name: FQDN
    description: "Fully qualified domain name"
    default: "traefik.example.com"
    required: false
compose: |
  version: "3.7"
  
  services:
    traefik:
      image: traefik:v2.10
      container_name: traefik
      init: true
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      networks:
        - proxy
      ports:
        - 80:80
        - 443:443
      environment:
        - TZ=Europe/Madrid
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ./config/traefik.yml:/traefik.yml:ro
        - ./config/dynamic.yml:/dynamic.yml:ro
        - ./config/users.txt:/users.txt:ro
        - ./config/acme.json:/acme.json
        - logs:/var/log/traefik
      labels:
        - traefik.http.services.traefik.loadbalancer.server.port=80
        - traefik.http.routers.traefik.entrypoints=websecure
        - traefik.http.routers.traefik.rule=Host(`${FQDN}`)
        - traefik.http.routers.traefik.middlewares=myauth@file
        - traefik.http.routers.traefik.service=api@internal
  
  volumes:
    logs: {}
  
  networks:
    proxy:
      external: true
