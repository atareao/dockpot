name: rabbitmq
description: "RabbitMQ - Message broker with management UI"
category: "middleware"
variables:
  - name: RABBITMQ_PORT
    description: "Management UI port"
    default: "9090"
    required: false
  - name: RABBITMQ_AMQP_PORT
    description: "AMQP protocol port"
    default: "5672"
    required: false
  - name: RABBITMQ_USER
    description: "Default RabbitMQ user"
    default: "guest"
    required: false
  - name: RABBITMQ_PASS
    description: "Default RabbitMQ password"
    default: "guest"
    required: false
  - name: RABBITMQ_TAG
    description: "RabbitMQ image tag"
    default: "3-management"
    required: false
compose: |
  services:
    rabbitmq:
      image: rabbitmq:${RABBITMQ_TAG}
      container_name: ${STACK_NAME}
      init: true
      restart: unless-stopped
      ports:
        - ${RABBITMQ_PORT}:15672
        - ${RABBITMQ_AMQP_PORT}:5672
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}