name: nginx
description: "Nginx web server with static content"
category: web
variables:
  - name: NGINX_TAG
    description: "Nginx image tag"
    default: alpine
    required: false
  - name: NGINX_HTTP_PORT
    description: "HTTP port"
    default: "80"
    required: false
  - name: NGINX_HTTPS_PORT
    description: "HTTPS port"
    default: "443"
    required: false
  - name: NGINX_CONF_DIR
    description: "Config directory"
    default: "./nginx/conf.d"
    required: false
  - name: NGINX_HTML_DIR
    description: "HTML directory"
    default: "./nginx/html"
    required: false
compose: |
  services:
    nginx:
      image: nginx:${NGINX_TAG:-alpine}
      container_name: ${STACK_NAME}-nginx
      ports:
        - "${NGINX_HTTP_PORT:-80}:80"
        - "${NGINX_HTTPS_PORT:-443}:443"
      volumes:
        - ${NGINX_CONF_DIR:-./nginx/conf.d}:/etc/nginx/conf.d:ro
        - ${NGINX_HTML_DIR:-./nginx/html}:/usr/share/nginx/html:ro
      restart: unless-stopped