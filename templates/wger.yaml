name: wger
category: productivity
description: Fitness tracker with PostgreSQL and Redis
variables:
- name: WGER_PORT
  description: Wger Port
  default: '8000'
  required: false
- name: WGER_TAG
  description: Wger Tag
  default: latest
  required: false
- name: DB_PASS
  description: Database Password
  default: change-me
  required: true
- name: SECRET_KEY
  description: Secret Key
  default: change-me
  required: true
compose: |
  version: "3.7"

  services:
    web:
      image: wger/server:${WGER_TAG}
      container_name: ${STACK_NAME}_server
      init: true
      depends_on:
        db:
          condition: service_healthy
        cache:
          condition: service_healthy
      environment:
        POSTGRES_USER: wger
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: wger
        DJANGO_SECRET_KEY: ${SECRET_KEY}
      volumes:
        - ${STACK_NAME}_static:/home/wger/static
        - ${STACK_NAME}_media:/home/wger/media
      healthcheck:
        test: wget --no-verbose --tries=1 --spider http://localhost:8000
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    nginx:
      image: nginx:stable
      container_name: ${STACK_NAME}_nginx
      init: true
      depends_on:
        - web
      volumes:
        - ${STACK_NAME}_config_nginx:/etc/nginx/conf.d/default.conf
        - ${STACK_NAME}_static:/wger/static:ro
        - ${STACK_NAME}_media:/wger/media:ro
      ports:
        - "${WGER_PORT}:80"
      healthcheck:
        test: service nginx status
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    db:
      image: postgres:15-alpine
      container_name: ${STACK_NAME}_db
      init: true
      environment:
        - POSTGRES_USER=wger
        - POSTGRES_PASSWORD=${DB_PASS}
        - POSTGRES_DB=wger
      volumes:
        - ${STACK_NAME}_postgres_data:/var/lib/postgresql/data/
      expose:
        - 5432
      healthcheck:
        test: pg_isready -U wger
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    cache:
      image: redis
      container_name: ${STACK_NAME}_cache
      init: true
      expose:
        - 6379
      healthcheck:
        test: redis-cli ping
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    celery_worker:
      image: wger/server:${WGER_TAG}
      container_name: ${STACK_NAME}_celery_worker
      init: true
      command: /start-worker
      environment:
        POSTGRES_USER: wger
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: wger
        DJANGO_SECRET_KEY: ${SECRET_KEY}
      volumes:
        - ${STACK_NAME}_media:/home/wger/media
      depends_on:
        web:
          condition: service_healthy
      healthcheck:
        test: celery -A wger inspect ping
        interval: 10s
        timeout: 5s
        retries: 5

    celery_beat:
      image: wger/server:${WGER_TAG}
      container_name: ${STACK_NAME}_celery_beat
      init: true
      command: /start-beat
      volumes:
        - ${STACK_NAME}_celery_beat:/home/wger/beat/
      environment:
        POSTGRES_USER: wger
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: wger
        DJANGO_SECRET_KEY: ${SECRET_KEY}
      depends_on:
        celery_worker:
          condition: service_healthy

  volumes:
    ${STACK_NAME}_postgres_data:
    ${STACK_NAME}_celery_beat:
    ${STACK_NAME}_static:
    ${STACK_NAME}_media:
    ${STACK_NAME}_config_nginx:

  networks:
    default:
      name: ${STACK_NAME}_network