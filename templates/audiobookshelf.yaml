name: audiobookshelf
category: media
description: Audiobookshelf audiobook server
variables:
- name: ABS_PORT
  description: Abs Port
  default: '13378'
  required: false
- name: ABS_TAG
  description: Abs Tag
  default: latest
  required: false
compose: "services:\n  audiobookshelf:\n    image: ghcr.io/advplyr/audiobookshelf:${ABS_TAG}\n\
  \    container_name: ${STACK_NAME}\n    restart: unless-stopped\n    volumes:\n \
  \     - ${STACK_NAME}_books:/books\n      - ${STACK_NAME}_metadata:/metadata\n  \
  \    - ${STACK_NAME}_config:/config\n    ports:\n      - \"${ABS_PORT}:80\"\n    \
  \  networks:\n      - proxy\n\nnetworks:\n  proxy:\n    external: true\n\nvolumes:\n\
  \  ${STACK_NAME}_books:\n    external: true\n  ${STACK_NAME}_metadata: {}\n  ${STACK_NAME}_config: {}"