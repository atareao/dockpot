name: uptime-kuma
description: "Uptime Kuma"
category: monitoring
variables:
  - name: KUMA_PORT
    description: "Web UI port"
    default: "3001"
    required: false
  - name: KUMA_TAG
    description: "Image tag"
    default: "latest"
    required: false
  - name: FQDN
    description: "Fully qualified domain name"
    default: "uptime.example.com"
    required: false
compose: |
  services:
    uptime_kuma:
      image: louislam/uptime-kuma:2
      container_name: uptime_kuma
      restart: unless-stopped
      init: true
      volumes:
        - data:/app/data
      networks:
        - proxy
      labels:
        traefik.enable: true
        traefik.http.services.uptime_kuma.loadbalancer.server.port: 3001
        traefik.http.routers.uptime_kuma-secure.entrypoints: https
        traefik.http.routers.uptime_kuma-secure.rule: Host(`${FQDN}`)
  volumes:
    data: {}
  networks:
    proxy:
      external: true
  x-dockge:
    urls:
      - https://${FQDN}
  
