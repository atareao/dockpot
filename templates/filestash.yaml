name: filestash
description: "Filestash"
category: tools
variables:
  - name: FS_PORT
    description: "Web UI port"
    default: "8334"
    required: false
  - name: FS_TAG
    description: "Image tag"
    default: "latest"
    required: false
  - name: FQDN
    description: "Fully qualified domain name"
    default: "filestash.example.com"
    required: false
compose: |
  services:
    filestash:
      image: machines/filestash
      container_name: filestash
      init: true
      restart: unless-stopped
      volumes:
        - filestash:/app/data/state/
      networks:
        - proxy
      labels:
        traefik.enable: "true"
        traefik.http.services.filestash.loadbalancer.server.port: "8334"
        traefik.http.routers.filestash.entrypoints: "https"
        traefik.http.routers.filestash.rule: "Host(`${FQDN}`)"
  
  volumes:
      filestash: {}
  networks:
    proxy:
      external: true
  
