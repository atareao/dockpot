name: copyparty
description: "Copyparty - File sharing and media server"
category: "tools"
variables:
  - name: COPYPARTY_PORT
    description: "Puerto para la interfaz web"
    default: "3923"
    required: false
  - name: COPYPARTY_TAG
    description: "Tag de la imagen"
    default: "latest"
    required: false
  - name: PUID
    description: "User ID"
    default: "1000"
    required: false
  - name: PGID
    description: "Group ID"
    default: "1000"
    required: false
compose: |
  services:
    copyparty:
      image: ghcr.io/9001/copyparty:${COPYPARTY_TAG:-latest}
      container_name: ${STACK_NAME}
      ports:
        - ${COPYPARTY_PORT:-3923}:3923
      volumes:
        - ${STACK_NAME}_config:/cfg
        - ${STACK_NAME}_data:/data
      environment:
        - PUID=${PUID:-1000}
        - PGID=${PGID:-1000}
      restart: unless-stopped