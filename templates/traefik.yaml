name: traefik
description: "Traefik reverse proxy with HTTPS"
category: proxy
variables:
  - name: TRAEFIK_TAG
    description: "Traefik image tag"
    default: v3.1
    required: false
  - name: LETSENCRYPT_EMAIL
    description: "Email for Let's Encrypt"
    default: ""
    required: true
  - name: HTTP_PORT
    description: "HTTP port"
    default: "80"
    required: false
  - name: HTTPS_PORT
    description: "HTTPS port"
    default: "443"
    required: false
  - name: DASHBOARD_DOMAIN
    description: "Dashboard domain"
    default: traefik.example.com
    required: false
  - name: LETSENCRYPT_DIR
    description: "Let's Encrypt data directory"
    default: "./traefik/letsencrypt"
    required: false
compose: |
  services:
    traefik:
      image: traefik:${TRAEFIK_TAG:-v3.1}
      container_name: ${STACK_NAME}-traefik
      command:
        - "--api.dashboard=true"
        - "--providers.docker=true"
        - "--providers.docker.exposedbydefault=false"
        - "--entrypoints.web.address=:80"
        - "--entrypoints.websecure.address=:443"
        - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
        - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
        - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      ports:
        - "${HTTP_PORT:-80}:80"
        - "${HTTPS_PORT:-443}:443"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ${LETSENCRYPT_DIR:-./traefik/letsencrypt}:/letsencrypt
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.middlewares=auth"
      restart: unless-stopped