name: traefik-http-auth
description: "HTTP route with Basic Auth middleware"
category: "traefik"
labels:
  traefik.enable: "true"
  traefik.http.routers.${SERVICE_NAME}.rule: "Host(`${HOSTNAME}`)"
  traefik.http.routers.${SERVICE_NAME}.entrypoints: "web"
  traefik.http.routers.${SERVICE_NAME}.middlewares: "${SERVICE_NAME}-auth"
  traefik.http.middlewares.${SERVICE_NAME}-auth.basicauth.users: "${AUTH_USERS}"
  traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port: "${PORT}"
variables:
  - name: HOSTNAME
    description: "Domain name"
    default: "example.com"
    required: true
  - name: PORT
    description: "Container port"
    default: "80"
    required: true
  - name: AUTH_USERS
    description: "Basic auth users (user:password hash, one per line)"
    default: "admin:$2y$10$..."
    required: true