name: weaviate
category: database
description: Weaviate vector database
variables:
- name: WEAVIATE_PORT
  description: Weaviate Port
  default: '8080'
  required: false
- name: WEAVIATE_TAG
  description: Weaviate Tag
  default: latest
  required: false
compose: "services:\n  weaviate:\n    container_name: ${STACK_NAME}\n    image: semitechnologies/weaviate:${WEAVIATE_TAG}\n\
  \    init: true\n    command:\n    - --host\n    - 0.0.0.0\n    - --port\n    - '8080'\n\
  \    - --scheme\n    - http\n    ports:\n    - \"${WEAVIATE_PORT}:8080\"\n    - 50051:50051\n\
  \    volumes:\n    - ${STACK_NAME}_data:/var/lib/weaviate\n    restart: on-failure:0\n\
  \    environment:\n      QUERY_DEFAULTS_LIMIT: 25\n      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:\
  \ 'true'\n      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'\n      DEFAULT_VECTORIZER_MODULE:\
  \ 'none'\n      CLUSTER_HOSTNAME: 'node1'\n\nvolumes:\n  ${STACK_NAME}_data:"