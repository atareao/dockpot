name: huginn
category: dev
description: Huginn - automation agents and event-driven workflows
variables:
- name: HUGINN_PORT
  description: Huginn web port
  default: '3000'
  required: false
- name: HUGINN_TAG
  description: Huginn image tag
  default: latest
  required: false
- name: DB_PASS
  description: MariaDB root password
  default: change-me
  required: true
- name: TZ
  description: Timezone
  default: Europe/Madrid
  required: false
compose: |
  services:
    mariadb:
      image: mariadb:11
      container_name: ${STACK_NAME}_db
      restart: unless-stopped
      init: true
      environment:
        MYSQL_DATABASE: huginn
        MYSQL_USER: huginn
        MYSQL_PASSWORD: ${DB_PASS}
        MARIADB_ROOT_PASSWORD: ${DB_PASS}
      volumes:
        - ${STACK_NAME}_mariadb:/var/lib/mysql
      networks:
        - internal
    huginn:
      image: huginn/huginn-single-process:${HUGINN_TAG}
      container_name: ${STACK_NAME}
      restart: unless-stopped
      init: true
      environment:
        TZ: ${TZ}
        DATABASE_NAME: huginn
        DATABASE_USERNAME: huginn
        DATABASE_PASSWORD: ${DB_PASS}
      depends_on:
        - mariadb
      networks:
        - internal
        - proxy
    threaded:
      image: huginn/huginn-single-process:${HUGINN_TAG}
      container_name: ${STACK_NAME}_threaded
      restart: unless-stopped
      init: true
      environment:
        TZ: ${TZ}
        DATABASE_NAME: huginn
        DATABASE_USERNAME: huginn
        DATABASE_PASSWORD: ${DB_PASS}
        WORKER_CMD: bin/threaded.rb
      depends_on:
        - mariadb
      networks:
        - internal
  volumes:
    ${STACK_NAME}_mariadb:
  networks:
    internal:
    proxy:
      external: true