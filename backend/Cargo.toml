[package]
name = "dockpot"
version = "0.1.0"
edition = "2021"
description = "Gestor de stacks Docker Compose con interfaz web"
license = "MIT"
repository = "https://github.com/atareao/dockpot"
homepage = "https://github.com/atareao/dockpot"
keywords = ["docker", "compose", "stacks", "management"]
categories = ["web-programming", "tools"]

[[bin]]
name = "dockpot"
path = "src/main.rs"

[lib]
name = "dockpot"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls",
] }

# OIDC / Auth
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
base64 = "0.22"
cookie = "0.18"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Docker
bollard = "0.18"

# Git
git2 = "0.20"

# Embed SPA
include_dir = "0.7"

# General
uuid = { version = "1.23", features = ["v4", "serde"] }
anyhow = "1.0"

# PKCE
sha1 = "0.10"
sha2 = "0.10"

url = "2.5"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"