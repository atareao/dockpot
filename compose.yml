services:
  dockpot:
    build: .
    container_name: dockpot
    ports:
      - "3056:3056"
    user: root:root
    volumes:
      # ── Socket de Podman (rootless) ──────────────────────────
      # Monta el socket de podman donde bollard y docker CLI lo esperan
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z
      #
      # ── Host filesystem (lectura) para discover/import ────────
      # Necesario para leer ficheros compose de proyectos externos.
      # Ajusta la ruta si tus proyectos están en otro directorio.
      - /data:/data:ro
      #
      # ── Datos ─────────────────────────────────────────────────
      - dockpot-data:/app/data
      - dockpot-stacks:/app/stacks
      # ── Templates (override) ─────────────────────────────────
      - ./templates:/app/templates:ro
    environment:
      - HOST=0.0.0.0
      - PORT=3056
      - DATA_DIR=/app/data
      - DATABASE_URL=/app/data/dockpot.db
      - STACKS_DIR=/app/stacks
      - RUST_LOG=info
      - LOG_FORMAT=pretty
      - DOCKER_HOST=unix:///var/run/docker.sock
      # ── Modo dev (sin OIDC) ──
      # Sin OIDC_ISSUER_URL → dockpot arranca en modo dev sin auth
      #
      # Para producción, descomenta estas líneas:
      # - OIDC_ISSUER_URL=https://auth.tudominio.com
      # - OIDC_CLIENT_ID=dockpot
      # - OIDC_CLIENT_SECRET=xxxx
      # - OIDC_REDIRECT_URL=http://localhost:3056/auth/callback
    restart: unless-stopped

volumes:
  dockpot-data:
  dockpot-stacks: